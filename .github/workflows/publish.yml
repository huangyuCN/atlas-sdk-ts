# npm 发布工作流（发布就绪形态）：push tag v* 或手动触发。
# 前置配置：仓库 Settings → Secrets → Actions 添加 NPM_TOKEN（npm publish 权限的
# automation token）。配置后 push tag（如 v0.5.0）即可发布；未配置时构建步骤成功、
# 发布步骤明确报缺凭证。
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅验证构建与 pack，不发布'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # golden 向量源仓 = atlas 主仓（与 ci.yml 同款检出）：golden 对齐测试经
      # ATLAS_GOLDEN_DIR 读该检出，缺失时报 ENOENT manifest.json。
      # atlas 为私有仓：检出用只读 PAT（fine-grained，仅授 atlas 仓 Contents:Read），
      # 经 secrets.ATLAS_CI_TOKEN 注入；未配置时守卫步骤给出配置指引后失败。
      - name: 校验向量源仓访问凭证
        env:
          TOKEN_SET: ${{ secrets.ATLAS_CI_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::secrets.ATLAS_CI_TOKEN 未配置：atlas 主仓为私有仓，golden 对齐测试需要检出它。"
            echo "::error::GitHub → Settings → Developer settings → Fine-grained tokens 新建（仅 atlas 仓，Contents: Read）"
            echo "::error::再到本仓 Settings → Secrets and variables → Actions 添加 ATLAS_CI_TOKEN，然后重跑本工作流。"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas
          ref: feat/actor
          path: atlas
          token: ${{ secrets.ATLAS_CI_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 测试（含 golden 对齐）
        run: pnpm check
        env:
          ATLAS_GOLDEN_DIR: ${{ github.workspace }}/atlas/testdata/golden
      - name: 构建（ESM + CJS + d.ts）
        run: pnpm build
      - name: pack 预检（产物内容与体积）
        run: npm pack --dry-run
      - name: 发布（tag 触发或手动非 dry-run）
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.dry_run == false) }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: dry-run 说明（发布就绪校验完成，未发布）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (inputs.dry_run != false) }}
        run: echo '发布就绪校验通过；实际发布请 push v* tag 或以 dry_run=false 手动触发'
