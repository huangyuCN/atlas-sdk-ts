# npm 发布工作流（发布就绪形态）：push tag v* 或手动触发。
# 前置配置：仓库 Settings → Secrets → Actions 添加 NPM_TOKEN（npm publish 权限的
# automation token）。配置后 push tag（如 v0.5.0）即可发布；未配置时构建步骤成功、
# 发布步骤明确报缺凭证。
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅验证构建与 pack，不发布'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # 跨仓检出凭证：首选 GitHub App 安装令牌（只读、1 小时过期、不绑个人），
      # 未配置 APP_ID / APP_PRIVATE_KEY 或签发失败时回退旧 PAT 链路。
      - name: 签发 GitHub App 安装令牌（跨仓只读）
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: atlas,atlas-game-layout,atlas-sdk-go,cow
      # golden 向量源仓 = atlas 主仓（与 ci.yml 同款检出）：golden 对齐测试经
      # ATLAS_GOLDEN_DIR 读该检出，缺失时报 ENOENT manifest.json。
      # atlas 为私有仓：检出用只读 App 令牌（App 装到 atlas，权限仅 Contents: Read）。
      - name: 校验向量源仓访问凭证
        env:
          APP_TOKEN_OK: ${{ steps.app-token.outcome == 'success' }}
          PAT_SET: ${{ secrets.ATLAS_CI_TOKEN != '' }}
        run: |
          if [ "$APP_TOKEN_OK" != "true" ] && [ "$PAT_SET" != "true" ]; then
            echo "::error::跨仓检出无可用凭证：App 令牌未签发，且 ATLAS_CI_TOKEN 未配置。"
            echo "::error::检查本仓 Secrets 的 APP_ID / APP_PRIVATE_KEY，以及 App 是否已安装到 huangyuCN/atlas（Contents: Read）。"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas
          # pin 固定 sha：上游移动分支会让「重生成无 diff」门禁红绿不定，无法区分
          # 「我们忘了重生成」与「上游动了」。bump 时改这里（三仓同步）。
          ref: 08933f9ae854f66e196c38d2dead789511153e89
          path: atlas
          token: ${{ steps.app-token.outputs.token || secrets.ATLAS_CI_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 测试（含 golden 对齐）
        run: pnpm check
        env:
          ATLAS_GOLDEN_DIR: ${{ github.workspace }}/atlas/testdata/golden
      - name: 构建（ESM + CJS + d.ts）
        run: pnpm build
      - name: pack 预检（产物内容与体积）
        run: npm pack --dry-run
      - name: 发布（tag 触发或手动非 dry-run）
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.dry_run == false) }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: dry-run 说明（发布就绪校验完成，未发布）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (inputs.dry_run != false) }}
        run: echo '发布就绪校验通过；实际发布请 push v* tag 或以 dry_run=false 手动触发'
