name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      # golden 向量源仓 = atlas 主仓（协议单点：规范与向量同仓，transport/frame 生成）。
      # ref 跟随 feat/actor 分支；向量内容由 manifest 逐文件 sha256 校验兜底，
      # 协议基线以 manifest.atlasCommit 记录（完整 pin/机器人自动化为规范 P5）。
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas
          ref: feat/actor
          path: atlas
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 单测 + golden 对齐
        run: pnpm check
        env:
          ATLAS_GOLDEN_DIR: ${{ github.workspace }}/atlas/testdata/golden
      - name: 构建（ESM + CJS + d.ts 三形态）
        run: pnpm build
