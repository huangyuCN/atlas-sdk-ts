name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      # golden 向量源仓（规范 §8.1：四语言消费同一份向量；pin 到固定 commit，
      # 向量更新时同步推进——完整机器人自动化为规范 P5）。
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas-sdk-go
          ref: d212872175cecc27c16d98f1f54ca0432f843932
          path: vector-source/atlas-sdk-go
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 单测 + golden 对齐
        run: pnpm check
        env:
          ATLAS_GOLDEN_DIR: ${{ github.workspace }}/vector-source/atlas-sdk-go/testdata/golden
      - name: 构建（ESM + CJS + d.ts 三形态）
        run: pnpm build
