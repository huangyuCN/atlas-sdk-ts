name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      # 跨仓检出凭证：首选 GitHub App 安装令牌（只读、1 小时过期、不绑个人），
      # 未配置 APP_ID / APP_PRIVATE_KEY 或签发失败时回退旧 PAT 链路。
      - name: 签发 GitHub App 安装令牌（跨仓只读）
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: atlas,atlas-game-layout,atlas-sdk-go,cow
      # golden 向量源仓 = atlas 主仓（协议单点：规范与向量同仓，transport/frame 生成）。
      # ref 跟随 feat/actor 分支；向量内容由 manifest 逐文件 sha256 校验兜底，
      # 协议基线以 manifest.atlasCommit 记录（完整 pin/机器人自动化为规范 P5）。
      # atlas 为私有仓：检出用只读 App 令牌（App 装到 atlas，权限仅 Contents: Read）。
      - name: 校验向量源仓访问凭证
        env:
          APP_TOKEN_OK: ${{ steps.app-token.outcome == 'success' }}
          PAT_SET: ${{ secrets.ATLAS_CI_TOKEN != '' }}
        run: |
          if [ "$APP_TOKEN_OK" != "true" ] && [ "$PAT_SET" != "true" ]; then
            echo "::error::跨仓检出无可用凭证：App 令牌未签发，且 ATLAS_CI_TOKEN 未配置。"
            echo "::error::检查本仓 Secrets 的 APP_ID / APP_PRIVATE_KEY，以及 App 是否已安装到 huangyuCN/atlas 与 huangyuCN/atlas-game-layout（Contents: Read）。"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas
          # pin 固定 sha：上游移动分支会让「重生成无 diff」门禁红绿不定，无法区分
          # 「我们忘了重生成」与「上游动了」。bump 时改这里（三仓同步）。
          ref: 08933f9ae854f66e196c38d2dead789511153e89
          path: atlas
          token: ${{ steps.app-token.outputs.token || secrets.ATLAS_CI_TOKEN }}
      # 模板仓 = 会话协议（契约消息）唯一来源（R13）：descriptor set 与三语言会话 stub 由它导出，
      # 「重生成无 diff」门禁需要它。目录名必须是 atlas-game-layout——gen-dto.sh 把
      # 「模板仓目录名 + 仓内相对路径」写进生成物文件头，路径变了产物就会 diff。
      # 游戏域消息（battle/game/matcher）不在这里生成：它们由游戏自己的协议包（模板仓 protocol/）
      # 独立发布，本仓 package.json 不依赖它（边界守卫见 test/gameDomainGuard.test.ts）。
      - uses: actions/checkout@v4
        with:
          repository: huangyuCN/atlas-game-layout
          # pin 固定 sha（同 atlas）：bump 时与 atlas 的 ref 一起改。
          ref: d0b0451a782428f4ae77b8bc3a16629b9b8269a8
          path: atlas-game-layout
          token: ${{ steps.app-token.outputs.token || secrets.ATLAS_LAYOUT_CI_TOKEN || secrets.ATLAS_CI_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 单测 + golden 对齐
        run: pnpm check
        env:
          ATLAS_GOLDEN_DIR: ${{ github.workspace }}/atlas/testdata/golden
      # 重生成无 diff 门禁：帧常量（框架生成物）、契约消息 stub 快照与冒烟 schema
      # （模板 descriptor set + lockstep 契约消息）都必须与入库产物逐字节一致——上游改了
      # 协议而本仓忘了重跑 gen-dto.sh，在 CI 直接失败；游戏域若被重新生成回来同样会红。
      - name: 安装 protoc（descriptor set 与 schema 重生成用）
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: 重生成无 diff 门禁（帧常量 + 契约消息 stub/schema）
        run: |
          bash scripts/gen-dto.sh
          git diff --exit-code
          # 上游两仓检出在本仓工作区内（path: atlas / atlas-game-layout），其未跟踪目录
          # 不代表本仓产物改动，必须排除（':!' 为 git pathspec 排除语法）。
          if [ -n "$(git status --porcelain -- . ':!atlas' ':!atlas-game-layout')" ]; then
            echo "::error::重生成产出了未入库的改动（含新增文件），请本地跑 bash scripts/gen-dto.sh 后提交产物"
            git status --porcelain -- . ':!atlas' ':!atlas-game-layout'
            exit 1
          fi
        env:
          ATLAS_DIR: ${{ github.workspace }}/atlas
          ATLAS_LAYOUT_DIR: ${{ github.workspace }}/atlas-game-layout
      - name: 构建（ESM + CJS + d.ts 三形态）
        run: pnpm build
